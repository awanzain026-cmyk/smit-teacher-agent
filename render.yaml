services:
  - type: web
    name: smit-teacher-agent-api
    rootDir: apps/api
    runtime: node
    buildCommand: npm run build && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: http://localhost:3000,https://<your-app>.vercel.app
      - key: QDRANT_COLLECTION
        value: smit_course_docs
      - key: LLM_PROVIDER
        value: sodeom
      - key: SODEOM_BASE_URL
        value: https://sodeom.com/v1
      - key: SODEOM_MODEL
        value: gpt-4o-mini
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: EMBEDDING_DIM
        value: "768"
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: MAX_FILE_MB
        value: "15"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_SEED_SECRET
        sync: false
